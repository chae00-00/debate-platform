version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: debate-postgres
    environment:
      POSTGRES_DB: debate_db
      POSTGRES_USER: debate_user
      POSTGRES_PASSWORD: debate_pass
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debate_user -d debate_db"]
      interval: 10s
      timeout: 5s
      retries: 5

volumes:
  postgres_data:
