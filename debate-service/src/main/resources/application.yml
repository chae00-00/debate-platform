  datasource:
    url: jdbc:postgresql://localhost:5432/debate_db
    username: debate_user
    password: debate_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:default-secret-key-for-development-only-change-in-production}
  expiration: 86400000

fastapi:
  url: ${FASTAPI_URL:https://complimentary-character-con-kevin.trycloudflare.com}
