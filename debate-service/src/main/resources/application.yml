spring:
  application:
    name: debate-service

  security:
    oauth2:
      client:
        registration:
          kakao:
            client-id: 3ed01edc8e7f9d8bb4c064d0bc5e650b
            redirect-uri: http://debate-mate.ai.kr/login/oauth2/code/kakao
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope: profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

  datasource:
    url: jdbc:postgresql://localhost:5432/debate_db
    username: debate_user
    password: debate_pass
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

server:
  port: 8080

jwt:
  secret: ${JWT_SECRET:default-secret-key-for-development-only-change-in-production}
  expiration: 86400000

fastapi:
  url: ${FASTAPI_URL:https://complimentary-character-con-kevin.trycloudflare.com}
