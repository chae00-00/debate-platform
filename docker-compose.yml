version: '3.8'

services:
  frontend:
    build: ./capstone_frontend
    ports:
      - "80:80"
    depends_on:
      - app
    restart: unless-stopped

  app:
    build: ./debate-service
    ports:
      - "8080:8080"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      - SPRING_DATASOURCE_URL=jdbc:postgresql://postgres:5432/debate_db
      - SPRING_DATASOURCE_USERNAME=debate_user
      - SPRING_DATASOURCE_PASSWORD=debate_pass
      - OAUTH_REDIRECT_URI=http://debate-mate.ai.kr/oauth/callback
      - FASTAPI_URL=https://surrey-logged-thousand-buried.trycloudflare.com
      - KAKAO_CLIENT_ID=${KAKAO_CLIENT_ID}
      - KAKAO_CLIENT_SECRET=${KAKAO_CLIENT_SECRET}
      - NAVER_CLIENT_ID=${NAVER_CLIENT_ID}
      - NAVER_CLIENT_SECRET=${NAVER_CLIENT_SECRET}
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    environment:
      - POSTGRES_DB=debate_db
      - POSTGRES_USER=debate_user
      - POSTGRES_PASSWORD=debate_pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U debate_user -d debate_db"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      - PGADMIN_DEFAULT_EMAIL=admin@debate.com
      - PGADMIN_DEFAULT_PASSWORD=admin123
    depends_on:
      - postgres
    restart: unless-stopped

volumes:
  postgres_data:
