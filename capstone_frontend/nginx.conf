server {
    listen 80;

    # React 정적 파일
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;
    }

    # API 프록시 → Spring Boot
    location /api/ {
        proxy_pass http://app:8080;
        proxy_http_version 1.1;

        # SSE 지원
        proxy_set_header Connection '';
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 86400s;
    }
}
